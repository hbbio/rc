# Sections name colors in the skin's [filehighlight] group.
[stalelink]
type=STALE_LINK

[directory]
type=DIR

[symlink]
type=SYMLINK

[executable]
type=FILE_EXE

[device]
type=DEVICE

[special]
type=SPECIAL

[archive]
extensions=zip;tar;gz;bz2;xz;zst;7z;rar

[source]
extensions=rs;c;h;cpp;py;js;ts;tsx;go;java;sh

[doc]
extensions=txt;md;rst;pdf;html;json;yaml;toml

[graph]
extensions=png;jpg;jpeg;gif;svg;webp;avif

[media]
extensions=mp3;wav;flac;mp4;mkv;webm

[hardlink]
type=HARDLINK
