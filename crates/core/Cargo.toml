[package]
name = "rust-commander-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core domain model and asynchronous workflows for Rust Commander"

[lib]
name = "rc_core"
path = "src/lib.rs"

[dependencies]
filetime = "0.2"
globset = "0.4"
rc-shell.workspace = true
regex = "1.11"
shlex.workspace = true
tracing.workspace = true
tui-input.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "process", "signal", "user"] }
