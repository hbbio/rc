[package]
name = "rust-commander"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A fast asynchronous TUI file manager inspired by Midnight Commander"
default-run = "rc"
keywords = ["file-manager", "tui", "terminal", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
shlex.workspace = true
open.workspace = true
rc-core.workspace = true
rc-ui.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "process", "signal", "term"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
getrandom.workspace = true
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
rc-platform.workspace = true
