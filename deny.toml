[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
# Temporary waivers must use the structured reason format enforced by
# scripts/validate_rust_advisory_waivers.sh. Waivers may last at most 90 days.
# Reason format: expires=YYYY-MM-DD; tracking=https://...; rationale
ignore = [
  # { id = "RUSTSEC-YYYY-NNNN", reason = "<format above>" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
